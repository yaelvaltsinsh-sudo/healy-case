<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">

*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
main{max-width:1920px;margin:0 auto;line-height:0;font-size:0}
main img,main video{display:block;width:100%;height:auto;border:0;outline:0;vertical-align:top;background:#fff}
video::-webkit-media-controls{display:none!important}
video::-webkit-media-controls-start-playback-button{display:none!important}
</style></head><body>

</main>
<script>
// Гарантированный автоплей: iOS/Android иногда ставят видео на паузу — запускаем, когда блок виден
(function(){
  var vids=[].slice.call(document.querySelectorAll('video'));
  function play(v){v.muted=true;var p=v.play();if(p&&p.catch)p.catch(function(){});}
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){
      if(e.isIntersecting){if(e.target.preload!=='auto')e.target.preload='auto';play(e.target);} else e.target.pause();
    });},{rootMargin:'300px 0px'});
    vids.forEach(function(v){io.observe(v);});
  } else vids.forEach(play);
  document.addEventListener('touchstart',function(){vids.forEach(function(v){if(v.paused)play(v);});},{once:true,passive:true});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)vids.forEach(function(v){var r=v.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight)play(v);});});
})();
</script>
</body></html>
